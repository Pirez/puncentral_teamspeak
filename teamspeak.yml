---
- name: Install and configure TeamSpeak 3 server
  hosts: teamspeak
  become: true

  vars:
    ts_version: "3.13.7"
    ts_user: "teamspeak"
    ts_dir: "/opt/teamspeak"
    ts_url: "https://files.teamspeak-services.com/releases/server/{{ ts_version }}/teamspeak3-server_linux_amd64-{{ ts_version }}.tar.bz2"
    ts_admin_password: "{{ lookup('file', '.env') | regex_findall('TS_ADMIN_PASSWORD=(.+)') | first }}"
    ts_password: "{{ lookup('file', '.env') | regex_findall('TS_PASSWORD=(.+)') | first }}"

    # Virtual server properties, applied via ServerQuery `serveredit` on every run.
    # Any virtualserver_* property accepted by serveredit can be added here.
    # codec_encryption_mode: 0 = per-channel, 1 = globally off, 2 = globally on.
    # Encryption off measurably reduces CPU and latency; only sane on a trusted server.
    ts_server_settings:
      virtualserver_name: "PunCentral"
      virtualserver_maxclients: 32
      virtualserver_codec_encryption_mode: 0
      virtualserver_welcomemessage: "Fire in the hole! The bomb has been planted — you have 40 seconds to land a decent pun. Rush B, don't stop punning."

    # Channels created if absent, matched by name. Existing channels are left
    # alone: channelcreate is not idempotent, so we skip names already present.
    ts_channels:
      - Puns

    # Audio quality is a *channel* property, not a server one. Codec values:
    #   0 Speex Narrowband   1 Speex Wideband   2 Speex Ultra-Wideband
    #   3 CELT Mono          4 Opus Voice       5 Opus Music
    # Quality is 0-10. TS3 defaults to Opus Voice at quality 6; 10 is the max.
    # Opus Voice is speech-optimised, Opus Music is better for streaming audio.
    # Higher quality raises per-client bandwidth on both server and clients.
    ts_channel_codec: 4
    ts_channel_codec_quality: 10
    # Apply the codec/quality above to every existing channel. Set false if you
    # tune channels by hand in the client — this overwrites per-channel settings.
    ts_channel_apply_quality: true

    # Backups — the sqlite db holds all channels, groups, permissions and
    # client identities. It is the only unrecoverable state on the host.
    ts_backup_dir: "/var/backups/teamspeak"
    ts_backup_retention_days: 14
    ts_backup_hour: "4"
    ts_backup_minute: "30"

  handlers:
    - name: Restart teamspeak
      ansible.builtin.systemd:
        name: teamspeak
        state: restarted

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        enabled: true

  tasks:
    # ── DNS ────────────────────────────────────────────────────────────────────

    - name: Configure primary DNS server in systemd-resolved
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNS='
        line: 'DNS=1.1.1.1'
        insertafter: '^\[Resolve\]'
      notify: Restart systemd-resolved

    - name: Configure fallback DNS server in systemd-resolved
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?FallbackDNS='
        line: 'FallbackDNS=8.8.8.8'
        insertafter: '^\[Resolve\]'
      notify: Restart systemd-resolved

    # ── System update ──────────────────────────────────────────────────────────

    - name: Update apt cache and dist-upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 0

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_required.stat.exists

    # ── Dependencies ───────────────────────────────────────────────────────────

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - bzip2
          - wget
          - libmariadb3
          - sqlite3   # consistent hot backups of ts3server.sqlitedb
        state: present

    # ── System user ────────────────────────────────────────────────────────────

    - name: Create teamspeak system user
      ansible.builtin.user:
        name: "{{ ts_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ ts_dir }}"
        create_home: false
        comment: "TeamSpeak 3 server"

    # ── Download & extract ─────────────────────────────────────────────────────

    - name: Check if TeamSpeak binary already exists
      ansible.builtin.stat:
        path: "{{ ts_dir }}/ts3server"
      register: ts_binary

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ ts_dir }}"
        state: directory
        owner: "{{ ts_user }}"
        group: "{{ ts_user }}"
        mode: "0750"
      when: not ts_binary.stat.exists

    - name: Download TeamSpeak 3 server archive
      ansible.builtin.get_url:
        url: "{{ ts_url }}"
        dest: "/tmp/teamspeak3-server_linux_amd64-{{ ts_version }}.tar.bz2"
        mode: "0600"
      when: not ts_binary.stat.exists

    - name: Extract TeamSpeak 3 server archive
      ansible.builtin.unarchive:
        src: "/tmp/teamspeak3-server_linux_amd64-{{ ts_version }}.tar.bz2"
        dest: "{{ ts_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        owner: "{{ ts_user }}"
        group: "{{ ts_user }}"
      when: not ts_binary.stat.exists

    - name: Remove archive
      ansible.builtin.file:
        path: "/tmp/teamspeak3-server_linux_amd64-{{ ts_version }}.tar.bz2"
        state: absent
      when: not ts_binary.stat.exists

    # ── License ────────────────────────────────────────────────────────────────

    - name: Accept TeamSpeak license
      ansible.builtin.file:
        path: "{{ ts_dir }}/.ts3server_license_accepted"
        state: touch
        owner: "{{ ts_user }}"
        group: "{{ ts_user }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    # ── Configuration ──────────────────────────────────────────────────────────

    - name: Deploy ts3server.ini
      ansible.builtin.copy:
        dest: "{{ ts_dir }}/ts3server.ini"
        owner: "{{ ts_user }}"
        group: "{{ ts_user }}"
        mode: "0640"
        content: |
          serveradmin_password={{ ts_admin_password }}
          # ServerQuery binds loopback only. It defaults to 0.0.0.0, which UFW
          # keeps closed — but geoblock.yml accepts all ports from Norwegian
          # IPs, which would expose 10011 to the whole country behind nothing
          # but this password. The setup script below connects via 127.0.0.1.
          query_ip=127.0.0.1
      notify: Restart teamspeak

    # ── systemd service ────────────────────────────────────────────────────────

    - name: Deploy systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/teamspeak.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=TeamSpeak 3 Server
          After=network.target

          [Service]
          Type=forking
          User={{ ts_user }}
          Group={{ ts_user }}
          WorkingDirectory={{ ts_dir }}
          ExecStart={{ ts_dir }}/ts3server_startscript.sh start inifile=ts3server.ini
          ExecStop={{ ts_dir }}/ts3server_startscript.sh stop
          ExecReload={{ ts_dir }}/ts3server_startscript.sh restart
          PIDFile={{ ts_dir }}/ts3server.pid
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify: Restart teamspeak

    - name: Enable and start TeamSpeak service
      ansible.builtin.systemd:
        name: teamspeak
        enabled: true
        state: started
        daemon_reload: true

    # ── Virtual server settings ────────────────────────────────────────────────

    - name: Write ServerQuery script to temporary file
      ansible.builtin.copy:
        dest: /tmp/ts3_settings.py
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/usr/bin/env python3
          import socket, sys, os, json, re

          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.connect(('127.0.0.1', 10011))
          s.settimeout(5)

          def recv_until(sock, marker=b'error id='):
              buf = b''
              while marker not in buf:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  buf += chunk
              return buf

          def send_cmd(sock, cmd):
              sock.sendall((cmd + '\n').encode())
              resp = recv_until(sock)
              if b'error id=0' not in resp:
                  print(f'command failed: {cmd.split(" ")[0]}', file=sys.stderr)
                  print(resp.decode(errors='replace'), file=sys.stderr)
                  sys.exit(1)
              return resp.decode(errors='replace')

          # ServerQuery is whitespace-delimited, so every value must be escaped.
          # Backslash first, or it would double-escape the sequences added after it.
          ESCAPES = [('\\', r'\\'), ('/', r'\/'), (' ', r'\s'), ('|', r'\p'),
                     ('\a', r'\a'), ('\b', r'\b'), ('\f', r'\f'),
                     ('\n', r'\n'), ('\r', r'\r'), ('\t', r'\t'), ('\v', r'\v')]

          def esc(value):
              out = str(value)
              for char, repl in ESCAPES:
                  out = out.replace(char, repl)
              return out

          admin_password = os.environ['TS_ADMIN_PASSWORD']
          server_password = os.environ['TS_PASSWORD']
          settings = json.loads(os.environ['TS_SERVER_SETTINGS'])
          channels = json.loads(os.environ['TS_CHANNELS'])
          codec = os.environ['TS_CHANNEL_CODEC']
          codec_quality = os.environ['TS_CHANNEL_CODEC_QUALITY']
          apply_quality = os.environ['TS_CHANNEL_APPLY_QUALITY'] == 'True'

          recv_until(s, b'TS3')  # banner
          send_cmd(s, f'login serveradmin {esc(admin_password)}')
          send_cmd(s, 'use 1')

          # Password is kept out of ts_server_settings so it stays sourced from .env.
          props = dict(settings, virtualserver_password=server_password)
          pairs = ' '.join(f'{k}={esc(v)}' for k, v in props.items())
          send_cmd(s, f'serveredit {pairs}')

          # channelcreate fails if the name is taken, so check the list first.
          # Names come back escaped, so compare in escaped form.
          existing = set(re.findall(r'channel_name=(\S+)', send_cmd(s, 'channellist')))
          for name in channels:
              if esc(name) in existing:
                  continue
              # Permanent, or the channel disappears as soon as it empties.
              send_cmd(s, f'channelcreate channel_name={esc(name)} '
                          f'channel_flag_permanent=1 '
                          f'channel_codec={esc(codec)} '
                          f'channel_codec_quality={esc(codec_quality)}')
              print(f'created channel: {name}')

          if apply_quality:
              resp = send_cmd(s, 'channellist')
              cids = re.findall(r'cid=(\d+)', resp)
              for cid in cids:
                  send_cmd(s, f'channeledit cid={cid} '
                              f'channel_codec={esc(codec)} '
                              f'channel_codec_quality={esc(codec_quality)}')
              print(f'applied codec={codec} quality={codec_quality} '
                    f'to {len(cids)} channel(s)')

          send_cmd(s, 'quit')
          s.close()

    - name: Wait for ServerQuery to accept connections on loopback
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 10011
        timeout: 60

    - name: Apply virtual server settings and channel audio quality
      ansible.builtin.command:
        cmd: /tmp/ts3_settings.py
      environment:
        TS_ADMIN_PASSWORD: "{{ ts_admin_password }}"
        TS_PASSWORD: "{{ ts_password }}"
        TS_SERVER_SETTINGS: "{{ ts_server_settings | to_json }}"
        TS_CHANNELS: "{{ ts_channels | to_json }}"
        TS_CHANNEL_CODEC: "{{ ts_channel_codec }}"
        TS_CHANNEL_CODEC_QUALITY: "{{ ts_channel_codec_quality }}"
        TS_CHANNEL_APPLY_QUALITY: "{{ ts_channel_apply_quality }}"
      register: ts_settings_result
      changed_when: false

    - name: Show applied channel quality
      ansible.builtin.debug:
        msg: "{{ ts_settings_result.stdout_lines }}"
      when: ts_settings_result.stdout_lines | length > 0

    - name: Remove ServerQuery script temporary file
      ansible.builtin.file:
        path: /tmp/ts3_settings.py
        state: absent

    # ── Backups ────────────────────────────────────────────────────────────────

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ ts_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"   # archives contain the serveradmin password

    - name: Deploy TeamSpeak backup script
      ansible.builtin.copy:
        dest: /usr/local/bin/backup-teamspeak.sh
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          BACKUP_DIR="{{ ts_backup_dir }}"
          TS_DIR="{{ ts_dir }}"
          RETENTION_DAYS={{ ts_backup_retention_days }}

          STAMP=$(date +%Y%m%d-%H%M%S)
          NAME="ts3-$STAMP"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # sqlite3 .backup snapshots the database consistently while the server
          # holds it open. A plain cp can capture a torn mid-transaction write.
          sqlite3 "$TS_DIR/ts3server.sqlitedb" ".backup '$WORK/ts3server.sqlitedb'"

          # Keep the ini alongside it so a restore is self-contained.
          cp "$TS_DIR/ts3server.ini" "$WORK/ts3server.ini"

          tar -czf "$BACKUP_DIR/$NAME.tar.gz" -C "$WORK" ts3server.sqlitedb ts3server.ini
          chmod 0600 "$BACKUP_DIR/$NAME.tar.gz"

          find "$BACKUP_DIR" -name 'ts3-*.tar.gz' -type f -mtime "+$RETENTION_DAYS" -delete

          echo "$(date -Iseconds) Backup written: $BACKUP_DIR/$NAME.tar.gz"

    - name: Run backup once to verify it works
      ansible.builtin.command: /usr/local/bin/backup-teamspeak.sh
      register: ts_backup_run
      changed_when: false

    - name: Show backup result
      ansible.builtin.debug:
        msg: "{{ ts_backup_run.stdout }}"

    - name: Schedule daily TeamSpeak backup
      ansible.builtin.cron:
        name: Backup TeamSpeak database
        minute: "{{ ts_backup_minute }}"
        hour: "{{ ts_backup_hour }}"
        user: root
        job: /usr/local/bin/backup-teamspeak.sh >> /var/log/teamspeak-backup.log 2>&1
        state: present

    # ── Firewall ───────────────────────────────────────────────────────────────

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Open TeamSpeak firewall ports
      when: "'ufw' in ansible_facts.packages"
      block:
        - name: Allow voice port 9987/udp
          community.general.ufw:
            rule: allow
            port: "9987"
            proto: udp

        - name: Allow file transfer port 30033/tcp
          community.general.ufw:
            rule: allow
            port: "30033"
            proto: tcp

    # ── Admin token ────────────────────────────────────────────────────────────

    - name: Wait for admin token in logs
      ansible.builtin.command:
        cmd: >
          grep -r "token=" {{ ts_dir }}/logs/
      register: ts_token_grep
      retries: 10
      delay: 5
      until: ts_token_grep.rc == 0
      changed_when: false
      failed_when: ts_token_grep.rc != 0

    - name: Display initial server admin token
      ansible.builtin.debug:
        msg: >-
          {{
            ts_token_grep.stdout_lines
            | select('search', 'token=')
            | map('regex_replace', '^.*token=(\S+).*$', '\1')
            | first
          }}
